# =============================================================================
# Environment override – Development
# =============================================================================
# All keys from values.yaml are listed here for visibility.
# Keys that differ from the base default are set explicitly.
# Keys matching the base default are commented out — uncomment to override.
#
# Supply s3.accessKeyId and s3.secretAccessKey via sealed-secrets or
# --set flags at deploy time. Never commit real credentials.
# =============================================================================

# -----------------------------------------------------------------------------
# Model Identification
# -----------------------------------------------------------------------------
model:
  # name: tiny-llama-test
  # displayName: "Tiny LLaMA Test"
  namespace: deploy-models-dev

# -----------------------------------------------------------------------------
# Project / Namespace Configuration
# -----------------------------------------------------------------------------
project:
  # create: true
  labels:
    environment: dev
  # annotations: {}

# -----------------------------------------------------------------------------
# S3 Object Storage Configuration
# -----------------------------------------------------------------------------
s3:
  # endpoint: "https://s3.openshift-storage.svc:443"
  # region: ""
  # bucket: ""
  # modelPath: "tiny-llama-test/1.0.0"
  accessKeyId: ""        # supply via --set or sealed-secret
  secretAccessKey: ""    # supply via --set or sealed-secret
  # verifySSL: "0"
  connectionSecretName: ""
  serviceAccountName: ""

# -----------------------------------------------------------------------------
# Inference Configuration
# -----------------------------------------------------------------------------
inference:
  replicas: 1

# -----------------------------------------------------------------------------
# Accelerator Configuration
# -----------------------------------------------------------------------------
# Uncomment ONE of the profiles below and set the correct values for your cluster.
#
# NVIDIA GPU profile:
# accelerator:
#   vendor: nvidia
#   count: 1
#   tolerations:
#     - effect: NoSchedule
#       key: nvidia.com/gpu
#       operator: Exists
#   nodeSelector: {}
#   runtimeProfile: vllm-cuda
#
# AMD Instinct GPU profile:
# accelerator:
#   vendor: amd
#   count: 1
#   tolerations:
#     - effect: NoSchedule
#       key: amd.com/gpu
#       operator: Exists
#   nodeSelector:
#     feature.node.kubernetes.io/amd-gpu: "true"
#   runtimeProfile: vllm-rocm

# -----------------------------------------------------------------------------
# Resource Allocation — GPU key derived from accelerator.vendor
# -----------------------------------------------------------------------------
resources:
  limits:
    cpu: "2"
    memory: 4Gi
  requests:
    cpu: "2"
    memory: 4Gi

# -----------------------------------------------------------------------------
# Pod Scheduling — non-GPU constraints only
# -----------------------------------------------------------------------------
scheduling:
  nodeSelector: {}
  tolerations: []
  affinity: {}


# -----------------------------------------------------------------------------
# Gateway Configuration
# -----------------------------------------------------------------------------
# dev: no external Route — gateway not exposed externally in dev.
# The LLMInferenceService controller manages the HTTPRoute automatically.
# Models are accessible cluster-internally via the gateway-internal DNS.
#
# Internal URL for this model:
#   http://openshift-ai-inference-openshift-ingress.svc.cluster.local/deploy-models-dev/<model.name>/v1/
gateway:
  name: maas-default-gateway
  namespace: openshift-ingress
  wildcardDomain: ""   # set to your cluster wildcard domain: oc get ingresses.config/cluster -o jsonpath='{.spec.domain}'
  exposeGateway: false

# -----------------------------------------------------------------------------
# Additional Labels / Annotations
# -----------------------------------------------------------------------------
labels:
  environment: dev

annotations: {}
